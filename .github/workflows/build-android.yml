name: Build Android Debug APK and Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Daily Earn Pro APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node.js and npm
        run: |
          echo "=== Node.js Version Check ==="
          node -v
          npm -v
          NODE_MAJOR=$(node -v | cut -d'v' -f2 | cut -d'.' -f1)
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "Error: Node.js version is lower than 22 ($NODE_MAJOR). Capacitor CLI requires NodeJS >=22.0.0."
            exit 1
          fi
          echo "Verified Node.js version $NODE_MAJOR (>=22.0.0 requirement met)"

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        run: |
          ANDROID_HOME_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_HOME_DIR" ]; then
            ANDROID_HOME_DIR="$HOME/Android/Sdk"
            mkdir -p "$ANDROID_HOME_DIR"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME_DIR/cmdline-tools/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: 5 & 6. Accept Android SDK Licenses & Install Components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/tools/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager from: $SDKMANAGER_BIN"
            echo "Accepting Android SDK licenses non-interactively..."
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true

            echo "Installing required Android SDK platform and build tools..."
            yes | "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "Warning: sdkmanager not found in standard paths; relying on runner SDK"
          fi

      - name: 7 & 8. Install Project Dependencies
        run: |
          echo "Installing dependencies with npm install (Node.js $(node -v))..."
          npm install

      - name: Verify Capacitor CLI
        run: |
          echo "Active Node.js: $(node -v)"
          npx cap --version

      - name: 9. Run npm run build
        run: |
          if npm run | grep -q "build"; then
            echo "Executing npm run build..."
            npm run build
          else
            echo "No build script found, skipping."
          fi

      - name: 10. Validate Web Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html missing after npm run build!"
            exit 1
          fi
          echo "Web build output verified successfully in dist/"

      - name: 11. Install and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist. Adding Capacitor Android..."
            npx cap add android
          else
            echo "Android folder already exists. Skipping add..."
          fi
          echo "Running Capacitor sync on Node.js $(node -v)..."
          npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "Error: android/gradlew not found!"
            exit 1
          fi

      - name: 12. Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 13. Verify Debug APK
        run: |
          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK does not exist!"
            exit 1
          fi
          echo "Verified APK exists at $EXPECTED_APK"
          # Prepare named APK for GitHub Releases upload
          cp "$EXPECTED_APK" Daily-Earn-Pro.apk
          ls -lh Daily-Earn-Pro.apk

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Earn-Pro-APK
          path: Daily-Earn-Pro.apk
          retention-days: 30
          if-no-files-found: error

      - name: 14 & 15. Create GitHub Release and Upload Daily-Earn-Pro.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Daily Earn Pro v${{ github.run_number }}
          body: |
            ## Daily Earn Pro - Android Release
            
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **Target:** Android Debug APK
            
            ### Download APK
            Download **Daily-Earn-Pro.apk** below and install it directly on your Android phone.
          draft: false
          prerelease: false
          files: Daily-Earn-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
