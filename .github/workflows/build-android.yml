name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Daily Earn Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK Environment
        run: |
          ANDROID_HOME_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_HOME_DIR" ]; then
            ANDROID_HOME_DIR="$HOME/Android/Sdk"
            mkdir -p "$ANDROID_HOME_DIR"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME_DIR/cmdline-tools/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK Components & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/tools/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager from: $SDKMANAGER_BIN"
            echo "Accepting Android SDK licenses non-interactively..."
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true

            echo "Installing required Android SDK platform and build tools..."
            yes | "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "Warning: sdkmanager not found in standard paths; relying on runner SDK"
          fi

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Validate Web Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html missing after npm run build!"
            exit 1
          fi
          echo "Web build successfully verified in dist/"

      - name: Add Android Platform via Capacitor (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist. Adding Android platform..."
            npx cap add android
          else
            echo "Android folder already exists. Skipping add..."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "Error: android/gradlew not found!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK was not generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Earn-Pro-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

          
