name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Daily Earn Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Validate Web Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html missing after npm run build!"
            exit 1
          fi
          echo "Web build successfully verified in dist/"

      - name: Add Android Platform via Capacitor (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist. Adding Android platform..."
            npx cap add android
          else
            echo "Android folder already exists. Skipping add..."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          else
            echo "Error: android/gradlew not found!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK was not generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyEarnPro-v1.0.0-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
          
